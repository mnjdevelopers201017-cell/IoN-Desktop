name: Build Desktop App (All OS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build for Current OS
        # This command builds a .deb for Linux, .msi for Windows, and .dmg for Mac automatically
        run: ./gradlew packageDistributionForCurrentOS

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: IoN-Installer-${{ matrix.os }}
          path: build/compose/binaries/main/
